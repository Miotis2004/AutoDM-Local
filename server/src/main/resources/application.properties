server.port=5150
spring.application.name=autodm-server

# ---------------------------------------------------------------------------
# Local SQLite data source
# ---------------------------------------------------------------------------
spring.datasource.driver-class-name=org.sqlite.JDBC
#
# The database path is fully configurable and never hard-coded. The default is
# resolved relative to the user home directory (${user.home}) so that the same
# configuration works across Windows, macOS and Linux without embedding a
# platform-specific absolute path. Override by setting this property externally
# (e.g. an environment variable AUTODM_DATABASE_PATH or a
# -Dautodm.database.path=/path/to/autodm.db JVM argument) or by editing this
# file. ${user.home} is expanded by Spring's environment at startup.
#
# On startup com.example.DatabaseBootstrap ensures the parent directory of this
# path exists so the database file can be created safely the first time the
# application runs (a relative path such as ./data/autodm.db works too). Creating
# the directory or file is a no-op when it already exists, so an existing database
# and all of its campaign data are left untouched. The schema is then applied
# idempotently (CREATE TABLE IF NOT EXISTS) by Spring Boot's SQL init below, so the
# schema may be re-run on every startup without destroying any data.
autodm.database.path=${user.home}/autodm.db
spring.datasource.url=jdbc:sqlite:${autodm.database.path}

# ---------------------------------------------------------------------------
# Active campaign selection
# ---------------------------------------------------------------------------
# The id of the campaign currently selected as the active campaign. Persisted to
# a small sidecar properties file (resolved relative to ${user.home}) so the
# selection survives application restarts without changing the database schema.
autodm.active.campaign.path=${user.home}/autodm-active.properties

# ---------------------------------------------------------------------------
# JPA / Hibernate configuration for SQLite
# ---------------------------------------------------------------------------
# The schema is versioned in src/main/resources/schema.sql and applied by Spring
# Boot's SQL init (spring.sql.init). Hibernate itself does not generate DDL, so
# hbm2ddl.auto is left at "none". The SQLite dialect is provided by
# com.example.db.SQLiteDialect.
spring.jpa.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.dialect=com.example.db.SQLiteDialect
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false
spring.jpa.show-sql=true

# ---------------------------------------------------------------------------
# Maintainable schema: load the versioned schema.sql against the SQLite file.
# "always" (not the default "embedded") is required because SQLite is not
# detected as an embedded database by Spring Boot. The schema uses only
# "CREATE TABLE IF NOT EXISTS" statements, so running it on every startup is
# idempotent and never drops or overwrites existing campaign data. continue-on-error
# keeps a partially-incomplete schema file from aborting startup.
# ---------------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=true
